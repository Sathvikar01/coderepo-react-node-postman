<!doctype html>
<html lang="en">
	<head>
		<script>
			document.documentElement.dataset.theme = localStorage.getItem("tracer-theme") === "light" || localStorage.getItem("request-desk-theme") === "light" ? "light" : "dark";
		</script>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F5F7F4" media="(prefers-color-scheme: light)" />
		<title>Tracer</title>
		<style>
			html,
			body,
			#root {
				width: 100%;
				min-width: 320px;
				min-height: 100%;
				margin: 0;
			}
			body {
				background: #0d1117;
			}
			html[data-theme="light"] body {
				background: #f5f7f4;
			}
			.initial-boot {
				display: grid;
				position: fixed;
				inset: 0;
				place-content: center;
				gap: 20px;
				background: #0d1117;
				color: #f5f7f4;
				font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			}
			html[data-theme="light"] .initial-boot {
				background: #f5f7f4;
				color: #10161d;
			}
			.initial-boot-brand {
				display: flex;
				align-items: center;
				gap: 12px;
				font-size: 22px;
				letter-spacing: 0.2px;
			}
		</style>
	</head>
	<body>
		<div id="root">
			<main class="initial-boot" role="status" aria-label="Opening Tracer">
				<div class="initial-boot-brand">
					<svg aria-hidden="true" width="34" height="34" viewBox="0 0 32 32">
						<path d="M3 20h6.5l4-11 6.5 18 4-11H29" fill="none" stroke="#63F5B5" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" />
						<circle cx="29" cy="16" fill="#63F5B5" r="2.6" />
					</svg>
					<strong>Tracer</strong>
				</div>
			</main>
		</div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
