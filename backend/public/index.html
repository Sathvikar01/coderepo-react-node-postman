<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F5F7F4" media="(prefers-color-scheme: light)" />
		<title>Tracer API</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<style>
			:root {
				color-scheme: dark;
				--surface: #0d1117;
				--surface-raised: #151b23;
				--border: #29313c;
				--ink: #c9d2dc;
				--ink-strong: #f5f7f4;
				--muted: #8b96a5;
				--brand: #63f5b5;
				--brand-ink: #04231a;
				--success: #63f5b5;
				--success-container: #12352a;
				--danger: #ff5d6c;
				--danger-container: #38181d;
			}

			@media (prefers-color-scheme: light) {
				:root {
					color-scheme: light;
					--surface: #f5f7f4;
					--surface-raised: #ffffff;
					--border: #cbd4cb;
					--ink: #2a3439;
					--ink-strong: #10161d;
					--muted: #5a6672;
					--brand: #0b8a5c;
					--brand-ink: #ffffff;
					--success: #0b8a5c;
					--success-container: #d8f5e6;
					--danger: #c6303f;
					--danger-container: #fbe3e5;
				}
			}

			* {
				box-sizing: border-box;
			}
			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-content: center;
				gap: 20px;
				padding: 32px;
				background: var(--surface);
				color: var(--ink);
				font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			}
			main {
				display: grid;
				max-width: 560px;
				gap: 18px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
				color: var(--ink-strong);
				font-size: 22px;
				font-weight: 600;
				letter-spacing: 0.2px;
			}
			p {
				margin: 0;
				color: var(--muted);
				font-size: 15px;
				line-height: 1.6;
			}
			code {
				padding: 2px 6px;
				border-radius: 6px;
				background: var(--surface-raised);
				border: 1px solid var(--border);
				font-family: "SFMono-Regular", Consolas, monospace;
				font-size: 13px;
			}
			.status {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px 16px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: var(--surface-raised);
				font-size: 14px;
			}
			.dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: var(--muted);
			}
			.status.ok .dot {
				background: var(--success);
			}
			.status.bad .dot {
				background: var(--danger);
			}
			a.primary {
				display: inline-flex;
				width: fit-content;
				align-items: center;
				justify-content: center;
				min-height: 42px;
				padding: 0 22px;
				border-radius: 999px;
				background: var(--brand);
				color: var(--brand-ink);
				font-size: 14px;
				font-weight: 600;
				text-decoration: none;
			}
			footer {
				color: var(--muted);
				font-size: 12.5px;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand">
				<svg aria-hidden="true" width="30" height="30" viewBox="0 0 32 32">
					<path d="M3 20h6.5l4-11 6.5 18 4-11H29" fill="none" stroke="#63F5B5" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" />
					<circle cx="29" cy="16" fill="#63F5B5" r="2.6" />
				</svg>
				Tracer
			</div>
			<p>The Tracer API is running. Open the workspace to compose, send, and inspect HTTP requests.</p>
			<div class="status" id="health"><span class="dot" id="dot"></span><span id="health-text">Checking the database connection…</span></div>
			<p>Product API base: <code>/api/v1</code>. Demo target base: <code>/demo/v1</code>.</p>
			<a class="primary" href="http://localhost:3000">Open the Tracer workspace</a>
			<footer>Tracer — an HTTP workspace for developers.</footer>
		</main>
		<script>
			(async () => {
				const box = document.getElementById("health");
				const dot = document.getElementById("dot");
				const text = document.getElementById("health-text");
				try {
					const response = await fetch("/api/v1/health");
					const payload = await response.json();
					const connected = payload?.data?.database === "connected";
					box.classList.add(connected ? "ok" : "bad");
					text.textContent = connected ? "API healthy, MongoDB connected." : `API degraded: database ${payload?.data?.database ?? "unknown"}.`;
				} catch {
					box.classList.add("bad");
					text.textContent = "The API health endpoint could not be reached.";
				}
				void dot;
			})();
		</script>
	</body>
</html>
