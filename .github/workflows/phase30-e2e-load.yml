name: Phase 30 E2E + Load

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "tests/load/**"
      - ".github/workflows/phase30-e2e-load.yml"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Seed and start Tracer
        shell: bash
        run: |
          bash setup.sh --seed
          bun start > /tmp/tracer.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tracer.log
          exit 1
      - name: Launch headless Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chrome.log
          exit 1
      - name: Browser end-to-end
        run: bun frontend/scripts/phase30-e2e.mjs
      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/tracer.log || true
          cat /tmp/chrome.log || true

  locust-load:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Seed and start Tracer
        shell: bash
        run: |
          bash setup.sh --seed
          bun start > /tmp/tracer.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tracer.log
          exit 1
      - name: Install external Locust
        run: python -m pip install --disable-pip-version-check locust==2.31.8 zope.event zope.interface
      - name: Light, moderate, burst load
        shell: bash
        env:
          TRACER_BASE_URL: http://127.0.0.1:8000
        run: |
          mkdir -p load-results
          locust -f tests/load/locustfile.py --headless -u 6 -r 3 -t 10s --host "$TRACER_BASE_URL" --only-summary --csv load-results/light
          locust -f tests/load/locustfile.py --headless -u 16 -r 4 -t 12s --host "$TRACER_BASE_URL" --only-summary --csv load-results/moderate
          locust -f tests/load/locustfile.py --headless -u 32 -r 16 -t 10s --host "$TRACER_BASE_URL" --only-summary --csv load-results/burst
      - uses: actions/upload-artifact@v4
        with:
          name: phase30-locust-results
          path: load-results/
