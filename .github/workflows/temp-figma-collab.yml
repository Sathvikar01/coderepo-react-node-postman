name: Temporary Figma Collaboration Acceptance

on:
  push:
    branches:
      - "chatgpt/restore-figma-workbench"

jobs:
  collaboration-ui:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Seed and start
        shell: bash
        run: |
          bash setup.sh --seed
          bun start > /tmp/tracer.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tracer.log
          exit 1
      - name: Phase 24 collaboration browser acceptance
        run: bun frontend/scripts/phase24-e2e.mjs
      - name: Reset deterministic seed
        run: bash setup.sh --seed
      - name: Phase 24B live collaboration browser acceptance
        run: bun frontend/scripts/phase24b-live-e2e.mjs
      - name: Dump app log on failure
        if: failure()
        run: cat /tmp/tracer.log || true
